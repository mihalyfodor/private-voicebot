<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicebot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <button id="menu-btn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div id="drawer-backdrop" hidden></div>
  <nav id="drawer" aria-hidden="true">
    <div class="drawer-section">
      <div class="drawer-title">Listening</div>
      <button id="hands-free-toggle" class="drawer-item">
        <span class="name">Hands-free</span>
        <span class="switch"><span class="knob"></span></span>
      </button>
    </div>
    <div class="drawer-section">
      <div class="drawer-title">Reply length</div>
      <div id="verbosity-control" class="verbosity-control">
        <input type="range" id="verbosity-slider" min="0" max="2" step="1" value="1">
        <div class="verbosity-labels">
          <span class="verbosity-label" data-value="0">short</span>
          <span class="verbosity-label" data-value="1">normal</span>
          <span class="verbosity-label" data-value="2">long</span>
        </div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-title">Avatar</div>
      <div id="avatar-list"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-title">Backdrop</div>
      <div id="backdrop-list" class="chip-grid"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-title">Memory</div>
      <button id="open-memory" class="drawer-item">
        <span class="name">Memory</span>
        <span class="desc">view and edit what is remembered</span>
      </button>
    </div>
    <div class="drawer-section">
      <div class="drawer-title">Characters</div>
      <button id="reload-characters" class="drawer-item">Reload characters</button>
    </div>
    <div class="drawer-spacer"></div>
    <div class="drawer-section">
      <button id="shutdown" class="drawer-item danger">Shut down</button>
    </div>
  </nav>
  <div id="shutdown-screen" hidden>
    <div class="title">Shut down complete</div>
    <div class="sub">Session memory saved. You can close this tab.</div>
  </div>

  <div id="backdrop"></div>
  <main>
    <section id="avatar">
      <canvas id="stage"></canvas>
      <div id="avatar-note" hidden>avatar assets missing — run <code>scripts/fetch_assets.sh</code></div>
      <div id="credit"></div>
    </section>

    <section id="workspace">
      <div id="view-tabs">
        <button class="view-tab active" data-view="chat">Chat</button>
        <button class="view-tab" data-view="memory">Memory</button>
      </div>

      <div id="view-chat" class="view">
        <section id="panel">
          <div id="transcript"></div>
          <button id="btn">Speak</button>
          <div id="status">connecting...</div>
        </section>
      </div>

      <div id="view-memory" class="view" hidden>
        <div id="memory-head">
          <div id="memory-count">Memory</div>
          <button id="memory-model-toggle" class="chip">model view</button>
        </div>
        <div id="memory-body">
          <div id="memory-sections"></div>
          <pre id="memory-rendered" hidden></pre>
        </div>
        <div id="memory-foot">
          <div id="memory-error"></div>
          <div class="memory-note">changes apply from the next reply</div>
          <button id="memory-reset" class="danger-link">Forget everything</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/vendor/pixi.min.js"></script>
  <script src="/static/vendor/live2dcubismcore.min.js"></script>
  <script src="/static/vendor/cubism4.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
